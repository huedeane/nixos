[general]
# Start fullscreen: true/false, or "current-screen" / "all"
fullscreen = false
# Initial window size: { mode = "smart" } or { mode = "size", width = 2000, height = 800 }
resize = { mode = "smart" }
# Try to make the window float
floating-hack = false
# Ask the compositor not to draw a title bar
no-window-decoration = false

# Command run on copy
copy-command = "wl-copy"
# Copy to clipboard after every annotation change
auto-copy = false
# Exit after these actions: ["all"] or any of "copy", "save", "save-as"
early-exit = ["all"]
# Where saves go (strftime codes and ~ allowed); remove to disable saving to file
output-filename = "~/Pictures/Screenshots/%Y-%m-%d_%H:%M:%S.png"
# Also save to output-filename whenever you copy
save-after-copy = false

# Actions run in order: save-to-clipboard, save-to-file, save-to-file-as, copy-filepath-to-clipboard, exit
actions-on-enter = ["save-to-clipboard"]
actions-on-escape = ["exit"]
actions-on-right-click = []

# pointer, crop, line, arrow, rectangle, text, marker, blur, brush
initial-tool = "arrow"
# Scale every annotation up or down
annotation-size-factor = 1
# Rectangle corner radius, 0 for sharp corners
corner-roundness = 10
default-fill-shapes = false
default-round-caps = true
# "block" or "freehand"; hold Ctrl at the start of a highlight for the other
primary-highlighter = "block"
# Brush smoothing, 0 disables (experimental)
brush-smooth-history-size = 0
# How far arrow keys move text (experimental)
text-move-length = 50.0

default-hide-toolbars = false
# Show toolbars when focused, hide when not (experimental)
focus-toggles-toolbars = false
disable-notifications = false
# "screenshot" or "app-icon"
notification-thumbnail = "screenshot"

# Zoom step per scroll (experimental)
zoom-factor = 1.1
# How far arrow keys pan (experimental)
pan-step-size = 50.0

[keybinds]
pointer = "p"
crop = "c"
brush = "b"
line = "i"
arrow = "z"
rectangle = "r"
ellipse = "e"
text = "t"
marker = "m"
blur = "u"
highlight = "g"

[font]
family = "ComicShannsMono Nerd Font Mono"
style = "Regular"
fallback = []

[color-palette]
# #RRGGBBAA, last two digits are opacity
palette = ["#e78284ff", "#e5c890ff", "#a6d189ff", "#8caaeeff", "#babbf1ff"]
# Presets in the colour picker, empty uses GTK's defaults
custom = []
