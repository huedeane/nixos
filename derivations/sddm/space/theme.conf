[General]
# "Space" variant: same QML as ../theme, with the black-hole wallpaper and the lock screen's
# deep navy palette (Frappé accents on darker bases). Assets/bg.png is resources/wallpaper.png,
# copied in by sddm-theme.nix.
#################### General ####################

# Screen Size
ScreenWidth="1920"
ScreenHeight="1080"
ScreenPadding="0"

# Font
Font="ComicShannsMono Nerd Font Mono"
FontSize="14"

# Panel Modification
RoundCorners="10"
# Login panel below the black hole, like the lock screen (1080p pixels below centre; default 150)
LoginOffsetY="310"
# Clock near the top edge, like the lock screen (1080p pixels; default 120)
ClockTopMargin="45"
# Lock screen clock (in the theme font): smaller, lavender colon, no shadow, date tucked under it
# (negative ClockDateGap pulls the date up into the clock font's descender space)
ClockSize="150"
ClockColonColor="#babbf1"
ClockShadow="false"
DateSize="21"
DateSpacing="10.5"
ClockDateGap="10"
# No dark fade over the bottom of the wallpaper
BottomFade="false"
# Slightly wider login panel (1080p pixels; default 330)
LoginWidth="370"
# Thicker Login button outline, like the lock screen's Unlock button (px; default 1)
LoginButtonBorder="2"

# Virutal Keyboard
# Default 0.4, Options 0.1-1.0
KeyboardSize="0.4"

# Time
Locale=""
TimeFormat="HH:mm"
DateFormat="dddd, MMMM d"

#################### Background ####################

BackgroundPlaceholder="./Assets/bg.png"
Background="./Assets/bg.png"
BackgroundSpeed="1.0"
PauseBackground=""
DimBackground="0.0"
CropBackground="true"
BackgroundHorizontalAlignment="center"
BackgroundVerticalAlignment="center"

#################### Colors ####################

# Focus/highlight colour for the login panel, session picker and buttons (lavender, like the lock screen)
ColorAccent="#babbf1"
# Username in the login panel
ColorUser="#e5c890"

ColorRosewater="#f2d5cf"
ColorFlamingo="#eebebe"
ColorPink="#f4b8e4"
ColorMauve="#ca9ee6"
ColorRed="#e78284"
ColorMaroon="#ea999c"
ColorPeach="#ef9f76"
ColorYellow="#e5c890"
ColorGreen="#a6d189"
ColorTeal="#81c8be"
ColorSky="#99d1db"
ColorSapphire="#85c1dc"
ColorBlue="#8caaee"
ColorLavender="#babbf1"
# Brighter text and deeper bases, sampled from the lock screen and wallpaper sky
ColorText="#e6e7f5"
ColorSubtext1="#c4c6e4"
ColorSubtext0="#a9abc9"
ColorOverlay2="#8e90ae"
ColorOverlay1="#767894"
ColorOverlay0="#60627c"
ColorSurface2="#4a4b62"
ColorSurface1="#3a3b50"
ColorSurface0="#2c2d3e"
ColorBase="#1f1f2c"
ColorMantle="#1a1a26"
ColorCrust="#151521"
